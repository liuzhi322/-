name: Daily Stock Screener At 9PM

on:
  schedule:
    - cron: '0 13 * * *' # 台灣時間每天 21:00 自動執行
  workflow_dispatch:

jobs:
  run-screener:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pandas yfinance requests finmind lxml

      - name: Run Screener
        run: python contest_screener.py

